name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

      - name: Build production assets
        run: npm run build

  deploy:
    name: Deploy production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pace.syntaxsystems.co
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh

          if [ -z "$SSH_PRIVATE_KEY_B64" ]; then
            echo "::error::VPS_SSH_PRIVATE_KEY_B64 is missing from the production environment secrets."
            exit 1
          fi

          if ! printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '[:space:]' | base64 --decode > ~/.ssh/id_ed25519; then
            echo "::error::VPS_SSH_PRIVATE_KEY_B64 is not valid Base64."
            exit 1
          fi

          chmod 600 ~/.ssh/id_ed25519

          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null; then
            echo "::error::VPS_SSH_PRIVATE_KEY_B64 does not decode to a valid unencrypted OpenSSH private key."
            exit 1
          fi

          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::VPS_SSH_KNOWN_HOSTS is missing from the production environment secrets."
            exit 1
          fi

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy release to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          for attempt in 1 2 3; do
            if ssh \
              -i ~/.ssh/id_ed25519 \
              -p "$VPS_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              "$VPS_USER@$VPS_HOST" \
              "git -C /var/www/pace/repository fetch --prune origin main && git -C /var/www/pace/repository reset --hard origin/main && /var/www/pace/repository/deploy/production.sh '$GITHUB_SHA'"; then
              exit 0
            else
              status=$?
            fi

            if [ "$status" -ne 255 ]; then
              echo "::error::The production release command failed with exit code $status."
              exit "$status"
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "SSH deployment attempt $attempt failed; retrying in 15 seconds."
              sleep 15
            fi
          done

          echo "::error::Unable to reach the production VPS after 3 SSH attempts."
          exit 1
